[package]
name = "stoatty_protocol"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true

# Detection reads the terminal's answer off raw fd 0, which needs poll and
# isatty. Nothing else in the crate touches the platform.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Pure-VT emitter programs, each run as the PTY shell of a stoatty scenario in
# tty/examples/. They are listed rather than left to autodiscovery so the
# manifest states the set instead of implying it from a directory listing.
[[example]]
name = "example_edit_app"
path = "examples/example_edit_app.rs"

[[example]]
name = "example_hello_app"
path = "examples/example_hello_app.rs"

[[example]]
name = "example_smooth_scroll_history_app"
path = "examples/example_smooth_scroll_history_app.rs"
