[package]
name = "stoat_buffer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# Compile the diff map's test-only builders. Off by default so a release build
# carries none of them, and enabled from a consumer's [dev-dependencies] so its
# tests do.
[features]
test-support = []

[dependencies]
stoat_language = { path = "../language" }
stoat_scheduler = { path = "../scheduler" }
stoat_text = { path = "../text" }
stoat_theme = { path = "../theme" }
ratatui.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tokio = { workspace = true, features = ["fs", "io-util", "net", "time"] }
futures = { workspace = true, features = ["alloc"] }
tracing.workspace = true
smallvec.workspace = true

[dev-dependencies]
stoat_config = { path = "../config" }
ron.workspace = true
stoat_scheduler = { path = "../scheduler", features = ["test-support"] }
