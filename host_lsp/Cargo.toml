[package]
name = "stoat_host_lsp"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# Compile the in-memory language-server fake and its param builders. Off by
# default so a release build carries none of them, and enabled from a
# consumer's [dev-dependencies] so its tests do.
[features]
test-support = []

[dependencies]
stoat_log = { path = "../log" }
stoat_scheduler = { path = "../scheduler" }
lsp-types.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "time"] }
futures = { workspace = true, features = ["alloc"] }
async-trait.workspace = true
libc.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
stoat_scheduler = { path = "../scheduler", features = ["test-support"] }
