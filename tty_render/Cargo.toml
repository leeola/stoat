[package]
name = "stoatty_render"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Compile in per-frame CPU/GPU timing and the perf HUD. Off by default so
# release builds carry no timing state or GPU timestamp features.
perf = []
# Expose the helpers the renderer's tests share. The crate's own integration
# tests turn it on through the self dev-dependency below.
test-support = []

[dependencies]
stoatty_protocol = { path = "../tty_protocol" }
stoatty_term = { path = "../tty_term" }
wgpu.workspace = true
tracing.workspace = true
bytemuck.workspace = true
raw-window-handle.workspace = true
futures = { workspace = true, features = ["executor"] }
cosmic-text.workspace = true
sys-locale.workspace = true
swash.workspace = true
ttf-parser.workspace = true
etagere.workspace = true
lru.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
divan = "0.1"
stoatty_render = { path = ".", features = ["test-support"] }

[[bench]]
name = "compose"
harness = false

[[bench]]
name = "shape"
harness = false
