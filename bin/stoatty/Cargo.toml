[package]
name = "stoatty_bin"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "stoatty_bin"
path = "src/lib.rs"

[[bin]]
name = "stoatty"
path = "src/bin/stoatty.rs"

[features]
# Forward the renderer's per-frame timing and perf HUD. Off by default.
perf = ["stoatty_render/perf"]
# Gate the tests that drive the `stoat` binary beside the test executable,
# which they need built with stoat's own fixture feature. Off by default, so a
# plain `cargo test` never builds or runs them.
fixture = []

[dependencies]
stoatty_protocol = { path = "../../tty_protocol" }
stoatty_term = { path = "../../tty_term" }
stoatty_render = { path = "../../tty_render" }
stoat_cli = { path = "../../cli" }
stoat_log = { path = "../../log" }
vscode_theme = { path = "../../vscode_theme" }
tracing.workspace = true
alacritty_terminal.workspace = true
arboard.workspace = true
clap.workspace = true
clap_complete.workspace = true
winit.workspace = true
portable-pty.workspace = true
libc.workspace = true
rustc-hash.workspace = true
serde.workspace = true
toml.workspace = true
etcetera.workspace = true
snafu.workspace = true
image.workspace = true
tempfile.workspace = true

[build-dependencies]
stoat_build_stamp = { path = "../../build_stamp" }

# Renders `stoat --fixture basic-diff` headlessly, so it needs the stoat binary
# built with its fixture feature. Run `cargo build -p stoat_bin --features
# fixture` first.
[[test]]
name = "headless_scene"
path = "tests/headless_scene.rs"
required-features = ["fixture"]

# Renders stoat fixtures headlessly on the ermine_night theme, so it needs the
# stoat binary built with its fixture feature, as headless_scene does.
[[test]]
name = "ermine_scenes"
path = "tests/ermine_scenes.rs"
required-features = ["fixture"]
