[package]
name = "stoat"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Compile in main-thread latency instrumentation. Off by default so release
# builds carry no timing rings or per-frame measurement.
perf = []
# Compile in the deterministic git/rust fixture materializer. Off by default
# so production builds carry no test-scaffolding code.
fixture = []

[dependencies]
codegraph = { path = "../codegraph" }
stoat_action = { path = "../action" }
stoat_buffer = { path = "../buffer" }
stoat_config = { path = "../config" }
stoat_host = { path = "../host" }
stoat_host_clipboard = { path = "../host_clipboard" }
stoat_host_git = { path = "../host_git" }
stoat_host_lsp = { path = "../host_lsp" }
stoat_host_terminal = { path = "../host_terminal" }
stoat_keymap = { path = "../keymap" }
stoat_language = { path = "../language" }
stoat_log = { path = "../log" }
stoat_review = { path = "../review" }
stoat_scheduler = { path = "../scheduler" }
stoat_selection = { path = "../selection" }
stoat_syntax = { path = "../syntax" }
stoat_text = { path = "../text" }
stoat_theme = { path = "../theme" }
regex-cursor.workspace = true
stoatty_protocol = { path = "../tty_protocol" }
vscode_theme = { path = "../vscode_theme" }
stoat_widgets = { path = "../widgets" }
ast-grep-core.workspace = true
emojis.workspace = true
ratatui.workspace = true
crossterm.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "time"] }
futures = { workspace = true, features = ["alloc"] }
tracing.workspace = true
etcetera.workspace = true
git2 = { version = "0.21", default-features = false }
pulldown-cmark.workspace = true
unicode-width.workspace = true
slotmap.workspace = true
lsp-types.workspace = true
async-trait.workspace = true
snafu = { workspace = true }
percent-encoding.workspace = true
libc.workspace = true
memchr.workspace = true
smallvec.workspace = true
vte.workspace = true
alacritty_terminal.workspace = true
globset.workspace = true
ignore.workspace = true
nucleo.workspace = true
tempfile.workspace = true
ron.workspace = true
time.workspace = true
blake3.workspace = true
image.workspace = true
base64.workspace = true
regex.workspace = true
flate2.workspace = true

[dev-dependencies]
insta = "1"
portable-pty.workspace = true
stoat_buffer = { path = "../buffer", features = ["test-support"] }
stoat_host = { path = "../host", features = ["test-support"] }
stoat_host_clipboard = { path = "../host_clipboard", features = ["test-support"] }
stoat_host_git = { path = "../host_git", features = ["test-support"] }
stoat_host_lsp = { path = "../host_lsp", features = ["test-support"] }
stoat_host_terminal = { path = "../host_terminal", features = ["test-support"] }
stoat_scheduler = { path = "../scheduler", features = ["test-support"] }
stoat_selection = { path = "../selection", features = ["test-support"] }
stoat_theme = { path = "../theme", features = ["test-support"] }
tracing-subscriber.workspace = true

# Live integration tests that drive a real headless Stoat against a
# materialized fixture. Gated on the `fixture` feature so a plain `cargo test`
# never builds or runs them. Opt in with `--features fixture`.
[[test]]
name = "fixture_live"
path = "tests/fixture_live.rs"
required-features = ["fixture"]

# Drives the real binary on a pty against a fixture, so it needs the fixture
# materializer and a built binary. Run `cargo build -p stoat_bin` first.
[[test]]
name = "foreign_terminal"
path = "tests/foreign_terminal.rs"
required-features = ["fixture"]
