[package]
name = "stoat_scheduler"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# Compile the deterministic test clock and scheduler. Off by default so a
# release build carries neither, and enabled from a consumer's
# [dev-dependencies] so its tests do.
[features]
test-support = []

[lib]
path = "src/scheduler.rs"
doctest = false

[dependencies]
async-task = { workspace = true }
futures = { workspace = true, features = ["alloc"] }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
