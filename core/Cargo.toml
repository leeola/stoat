[package]
name = "stoat_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# Compile the in-memory host fakes and the test-only builders. Off by default
# so a release build carries none of them, and enabled from a consumer's
# [dev-dependencies] so its tests do.
[features]
test-support = [
  "stoat_host/test-support",
  "stoat_host_clipboard/test-support",
  "stoat_host_git/test-support",
  "stoat_host_lsp/test-support",
  "stoat_host_terminal/test-support",
]

[dependencies]
stoat_host = { path = "../host" }
stoat_host_clipboard = { path = "../host_clipboard" }
stoat_host_git = { path = "../host_git" }
stoat_host_lsp = { path = "../host_lsp" }
stoat_host_terminal = { path = "../host_terminal" }

[dev-dependencies]
tempfile.workspace = true
stoat_host = { path = "../host", features = ["test-support"] }
stoat_host_clipboard = { path = "../host_clipboard", features = ["test-support"] }
stoat_host_git = { path = "../host_git", features = ["test-support"] }
stoat_host_lsp = { path = "../host_lsp", features = ["test-support"] }
stoat_host_terminal = { path = "../host_terminal", features = ["test-support"] }
