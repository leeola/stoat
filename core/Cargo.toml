[package]
name = "stoat_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# Compile the in-memory host fakes and the test-only builders. Off by default
# so a release build carries none of them, and enabled from a consumer's
# [dev-dependencies] so its tests do.
[features]
test-support = ["stoat_host/test-support"]

[dependencies]
stoat_action = { path = "../action" }
stoat_config = { path = "../config" }
stoat_host = { path = "../host" }
stoat_language = { path = "../language" }
stoat_log = { path = "../log" }
stoat_scheduler = { path = "../scheduler" }
stoat_text = { path = "../text" }
stoatty_protocol = { path = "../tty_protocol" }
vscode_theme = { path = "../vscode_theme" }
ratatui.workspace = true
crossterm.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "time"] }
futures = { workspace = true, features = ["alloc"] }
tracing.workspace = true
compact_str.workspace = true
git2 = { version = "0.21", default-features = false }
lsp-types.workspace = true
async-trait.workspace = true
snafu = { workspace = true }
portable-pty.workspace = true
libc.workspace = true
smallvec.workspace = true
arboard.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
ron.workspace = true
stoat_host = { path = "../host", features = ["test-support"] }
stoat_scheduler = { path = "../scheduler", features = ["test-support"] }
